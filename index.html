<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimation Immobilière</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#1e293b', accent: '#0284c7' } } }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Field = ({ label, type = 'text', value, onChange }) => (
            <div className="flex flex-col mb-3 w-full">
                <label className="text-xs font-bold text-slate-500 mb-1 ml-1">{label}</label>
                <input type={type} value={value} onChange={onChange} className="w-full p-3 border border-slate-200 rounded-xl text-sm bg-white text-slate-800 focus:border-accent outline-none" />
            </div>
        );

        function App() {
            const [view, setView] = useState('home'); 
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('immo_clients');
                return saved ? JSON.parse(saved) : [];
            });
            const [currentClient, setCurrentClient] = useState(getEmptyClient());
            const [activeTab, setActiveTab] = useState('client');

            useEffect(() => {
                setTimeout(() => lucide.createIcons(), 100);
            }, [view, activeTab, currentClient.medias]);

            function getEmptyClient() {
                return {
                    id: Date.now(), date: new Date().toLocaleDateString('fr-FR'),
                    nom: '', prenom: '', telephone: '', email: '', adresse: '', typeBien: 'Appartement',
                    surfaceHabitable: '', surfaceCarrez: '', annexes: { terrasse: '', balcon: '', jardin: '', cave: '', garage: '' },
                    distribution: { pieces: '', chambres: '', sainte: '', hauteurPlafond: '' },
                    env: { exposition: '', visAVis: '', bruit: '' },
                    chauffage: { type: '', energie: '', age: '' },
                    menuiseries: { vitrage: '', fenetres: '', volets: '', isolation: '' },
                    equipements: { cuisineEquipee: false, stationnement: false, borneRecharge: false },
                    travaux: { nature: '', dates: '', factures: false },
                    etat: { humidite: false, fissures: false, toiture: '', notesEtat: '' },
                    charges: { fonciere: '', copro: '' },
                    copro: { travauxVotes: '', ambiance: '' },
                    projet: { raison: '', delai: '', prixAttendu: '' },
                    medias: []
                };
            }

            const handleSave = () => {
                if (!currentClient.nom && !currentClient.prenom) {
                    alert('Renseignez au moins un nom ou prénom.');
                    return;
                }
                const existingIndex = clients.findIndex(c => c.id === currentClient.id);
                let updatedClients = [...clients];
                
                if (existingIndex >= 0) {
                    updatedClients[existingIndex] = currentClient;
                } else {
                    updatedClients = [currentClient, ...clients];
                }

                try {
                    localStorage.setItem('immo_clients', JSON.stringify(updatedClients));
                    setClients(updatedClients);
                    alert('Estimation sauvegardée avec succès.');
                    setView('home');
                } catch (e) {
                    alert("Erreur : La mémoire de l'application est pleine. Supprimez d'anciennes estimations ou réduisez le nombre de photos.");
                }
            };

            const handleMediaUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                Promise.all(files.map(file => {
                    return new Promise((resolve) => {
                        // Compression de l'image pour éviter de saturer la mémoire
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const MAX_WIDTH = 800; // Taille max optimisée
                                    const scaleSize = MAX_WIDTH / img.width;
                                    canvas.width = MAX_WIDTH;
                                    canvas.height = img.height * scaleSize;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                    resolve({ type: 'image/jpeg', url: canvas.toDataURL('image/jpeg', 0.7) });
                                };
                                img.src = event.target.result;
                            };
                            reader.readAsDataURL(file);
                        } else {
                            const reader = new FileReader();
                            reader.onload = (uploadEvent) => resolve({ type: file.type, url: uploadEvent.target.result });
                            reader.readAsDataURL(file);
                        }
                    });
                })).then(newMedias => {
                    setCurrentClient(prev => ({ ...prev, medias: [...prev.medias, ...newMedias] }));
                });
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
                    <header className="bg-primary text-white p-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center space-x-2">
                            <i data-lucide="building-2" className="w-6 h-6 text-accent"></i>
                            <span className="font-bold text-lg">ImmoEstime</span>
                        </div>
                        {view !== 'home' && (
                            <button onClick={() => setView('home')} className="p-2 hover:bg-slate-800 rounded-full">
                                <i data-lucide="home" className="w-5 h-5"></i>
                            </button>
                        )}
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 pb-20">
                        {view === 'home' && (
                            <div className="flex flex-col items-center justify-center h-[70vh] space-y-6">
                                <button onClick={() => { setCurrentClient(getEmptyClient()); setActiveTab('client'); setView('form'); }}
                                        className="w-full flex items-center justify-center space-x-3 bg-accent text-white py-4 px-6 rounded-xl shadow-lg">
                                    <i data-lucide="plus-circle" className="w-6 h-6"></i>
                                    <span className="font-medium text-lg">Nouvelle Estimation</span>
                                </button>
                                <button onClick={() => setView('list')}
                                        className="w-full flex items-center justify-center space-x-3 bg-slate-100 text-slate-700 py-4 px-6 rounded-xl border">
                                    <i data-lucide="folder-open" className="w-6 h-6"></i>
                                    <span className="font-medium text-lg">Dossiers ({clients.length})</span>
                                </button>
                            </div>
                        )}

                        {view === 'list' && (
                            <div className="space-y-4">
                                {clients.map(c => (
                                    <div key={c.id} onClick={() => { setCurrentClient(c); setActiveTab('client'); setView('form'); }} 
                                         className="bg-white border p-4 rounded-xl shadow-sm cursor-pointer">
                                        <h3 className="font-bold text-slate-800">{c.nom} {c.prenom} <span className="text-xs font-normal text-accent bg-sky-50 px-2 py-0.5 rounded-full ml-1">{c.typeBien}</span></h3>
                                        <p className="text-xs text-slate-500">{c.adresse} • {c.date}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'form' && (
                            <div className="space-y-6">
                                <div className="flex overflow-x-auto space-x-2 pb-2 border-b no-scrollbar">
                                    {['client', 'bien', 'technique', 'financier', 'medias'].map(tab => (
                                        <button key={tab} onClick={() => setActiveTab(tab)}
                                            className={`px-3 py-2 rounded-lg text-xs font-semibold capitalize ${activeTab === tab ? 'bg-primary text-white' : 'bg-slate-100'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>

                                <div>
                                    {activeTab === 'client' && (
                                        <>
                                            <div className="flex flex-col mb-3">
                                                <label className="text-xs font-bold text-slate-500 mb-1 ml-1">Type de bien</label>
                                                <select value={currentClient.typeBien} onChange={e => setCurrentClient({...currentClient, typeBien: e.target.value})} className="p-3 border rounded-xl bg-white text-sm">
                                                    <option>Appartement</option><option>Maison</option><option>Box / Garage</option><option>Terrain</option><option>Commerce / Bureau</option><option>Immeuble</option>
                                                </select>
                                            </div>
                                            <Field label="Nom" value={currentClient.nom} onChange={e => setCurrentClient({...currentClient, nom: e.target.value})} />
                                            <Field label="Prénom" value={currentClient.prenom} onChange={e => setCurrentClient({...currentClient, prenom: e.target.value})} />
                                            <Field label="Téléphone" type="tel" value={currentClient.telephone} onChange={e => setCurrentClient({...currentClient, telephone: e.target.value})} />
                                            <Field label="Email" type="email" value={currentClient.email} onChange={e => setCurrentClient({...currentClient, email: e.target.value})} />
                                            <Field label="Adresse du bien" value={currentClient.adresse} onChange={e => setCurrentClient({...currentClient, adresse: e.target.value})} />
                                        </>
                                    )}

                                    {activeTab === 'bien' && (
                                        <>
                                            <div className="grid grid-cols-2 gap-2">
                                                <Field label="Surf. Habitable (m²)" type="number" value={currentClient.surfaceHabitable} onChange={e => setCurrentClient({...currentClient, surfaceHabitable: e.target.value})} />
                                                <Field label="Loi Carrez (m²)" type="number" value={currentClient.surfaceCarrez} onChange={e => setCurrentClient({...currentClient, surfaceCarrez: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                <Field label="Pièces" type="number" value={currentClient.distribution.pieces} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, pieces: e.target.value}})} />
                                                <Field label="Chambres" type="number" value={currentClient.distribution.chambres} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, chambres: e.target.value}})} />
                                                <Field label="Salles d'eau" type="number" value={currentClient.distribution.sainte} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, sainte: e.target.value}})} />
                                            </div>
                                            <Field label="Terrasse / Balcon (m²)" value={currentClient.annexes.terrasse} onChange={e => setCurrentClient({...currentClient, annexes: {...currentClient.annexes, terrasse: e.target.value}})} />
                                            <Field label="Exposition / Vue" value={currentClient.env.exposition} onChange={e => setCurrentClient({...currentClient, env: {...currentClient.env, exposition: e.target.value}})} />
                                            <Field label="Vis-à-vis / Bruit" value={currentClient.env.bruit} onChange={e => setCurrentClient({...currentClient, env: {...currentClient.env, bruit: e.target.value}})} />
                                        </>
                                    )}

                                    {activeTab === 'technique' && (
                                        <>
                                            <Field label="Chauffage & Climatisation" value={currentClient.chauffage.type} onChange={e => setCurrentClient({...currentClient, chauffage: {...currentClient.chauffage, type: e.target.value}})} />
                                            <Field label="Menuiseries / Isolation" value={currentClient.menuiseries.vitrage} onChange={e => setCurrentClient({...currentClient, menuiseries: {...currentClient.menuiseries, vitrage: e.target.value}})} />
                                            
                                            <div className="flex flex-col mb-4 p-3 border rounded-xl bg-slate-50">
                                                <label className="text-xs font-bold text-slate-500 mb-2">Équipements présents</label>
                                                <label className="flex items-center space-x-2 mb-2 text-sm"><input type="checkbox" checked={currentClient.equipements.cuisineEquipee} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, cuisineEquipee: e.target.checked}})} /><span>Cuisine équipée</span></label>
                                                <label className="flex items-center space-x-2 mb-2 text-sm"><input type="checkbox" checked={currentClient.equipements.stationnement} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, stationnement: e.target.checked}})} /><span>Stationnement / Garage</span></label>
                                            </div>
                                            
                                            <div className="flex flex-col mb-3">
                                                <label className="text-xs font-bold text-slate-500 mb-1 ml-1">Travaux / Rénovations</label>
                                                <textarea className="p-3 border rounded-xl text-sm w-full" rows="2" value={currentClient.travaux.nature} onChange={e => setCurrentClient({...currentClient, travaux: {...currentClient.travaux, nature: e.target.value}})}></textarea>
                                            </div>
                                            <div className="flex flex-col mb-3">
                                                <label className="text-xs font-bold text-slate-500 mb-1 ml-1">État général (fissures, humidité)</label>
                                                <textarea className="p-3 border rounded-xl text-sm w-full" rows="2" value={currentClient.etat.notesEtat} onChange={e => setCurrentClient({...currentClient, etat: {...currentClient.etat, notesEtat: e.target.value}})}></textarea>
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'financier' && (
                                        <>
                                            <Field label="Taxe foncière (€)" type="number" value={currentClient.charges.fonciere} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, fonciere: e.target.value}})} />
                                            <Field label="Charges de copropriété (€/mois)" type="number" value={currentClient.charges.copro} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, copro: e.target.value}})} />
                                            <Field label="Projet / Motivation de vente" value={currentClient.projet.raison} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, raison: e.target.value}})} />
                                            <div className="grid grid-cols-2 gap-2">
                                                <Field label="Délai souhaité" value={currentClient.projet.delai} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, delai: e.target.value}})} />
                                                <Field label="Prix attendu (€)" type="number" value={currentClient.projet.prixAttendu} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, prixAttendu: e.target.value}})} />
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'medias' && (
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-3">
                                                <label className="flex flex-col items-center p-4 border-2 border-accent border-dashed rounded-xl bg-sky-50 text-accent cursor-pointer">
                                                    <i data-lucide="camera" className="w-6 h-6 mb-1"></i><span className="text-xs font-bold">Prendre photo</span>
                                                    <input type="file" accept="image/*" capture="environment" onChange={handleMediaUpload} className="hidden" />
                                                </label>
                                                <label className="flex flex-col items-center p-4 border-2 border-slate-300 border-dashed rounded-xl bg-slate-50 cursor-pointer">
                                                    <i data-lucide="image" className="w-6 h-6 mb-1"></i><span className="text-xs font-bold">Galerie</span>
                                                    <input type="file" accept="image/*" onChange={handleMediaUpload} className="hidden" />
                                                </label>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                {currentClient.medias.map((m, i) => (
                                                    <div key={i} className="aspect-square bg-slate-200 rounded-lg overflow-hidden relative">
                                                        <img src={m.url} className="w-full h-full object-cover" />
                                                        <button onClick={(e) => {
                                                            e.stopPropagation();
                                                            const newMedias = [...currentClient.medias];
                                                            newMedias.splice(i, 1);
                                                            setCurrentClient({...currentClient, medias: newMedias});
                                                        }} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 shadow">
                                                            <i data-lucide="x" className="w-3 h-3"></i>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <button onClick={handleSave} className="w-full bg-accent text-white py-4 rounded-xl shadow-lg mt-4 font-bold flex justify-center space-x-2">
                                    <i data-lucide="save" className="w-5 h-5"></i><span>Enregistrer le dossier</span>
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

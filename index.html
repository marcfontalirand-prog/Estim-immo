<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#1e293b', accent: '#0284c7' } } }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tab-content { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .toast-enter { animation: slideDown 0.3s ease-out forwards; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased font-sans overflow-x-hidden transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const TABS = ['client', 'bien', 'technique', 'financier', 'medias'];

        const Field = ({ label, type = 'text', value, onChange }) => (
            <div className="flex flex-col mb-3 w-full">
                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1">{label}</label>
                <input type={type} value={value} onChange={onChange} className="w-full p-3 border border-slate-200 dark:border-slate-700 rounded-xl text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:border-accent dark:focus:border-accent outline-none" />
            </div>
        );

        function getEmptyClient() {
            return {
                id: Date.now(), date: new Date().toLocaleDateString('fr-FR'),
                nom: '', prenom: '', telephone: '', email: '', adresse: '', typeBien: 'Appartement',
                surfaceHabitable: '', surfaceCarrez: '', annexes: { terrasse: '', balcon: '', jardin: '', cave: '', garage: '' },
                distribution: { pieces: '', chambres: '', sainte: '', hauteurPlafond: '' },
                env: { exposition: '', visAVis: '', bruit: '' },
                chauffage: { type: '', energie: '', age: '' },
                menuiseries: { vitrage: '', fenetres: '', volets: '', isolation: '' },
                equipements: { cuisineEquipee: false, stationnement: false, borneRecharge: false },
                travaux: { nature: '', dates: '', factures: false },
                etat: { humidite: false, fissures: false, toiture: '', notesEtat: '' },
                charges: { fonciere: '', copro: '' },
                copro: { travauxVotes: '', ambiance: '' },
                projet: { raison: '', delai: '', prixAttendu: '' },
                medias: []
            };
        }

        function App() {
            const [view, setView] = useState(() => localStorage.getItem('immo_draft') ? 'form' : 'home'); 
            const [clients, setClients] = useState(() => {
                const saved = localStorage.getItem('immo_clients');
                return saved ? JSON.parse(saved) : [];
            });
            const [currentClient, setCurrentClient] = useState(() => {
                const draft = localStorage.getItem('immo_draft');
                return draft ? JSON.parse(draft) : getEmptyClient();
            });
            
            const [activeTab, setActiveTab] = useState('client');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            // Gestion du thème
            const [theme, setTheme] = useState(() => localStorage.getItem('immo_theme') || 'light');

            useEffect(() => {
                const root = window.document.documentElement;
                if (theme === 'dark') {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
                localStorage.setItem('immo_theme', theme);
            }, [theme]);

            const showNotification = (msg, type = 'success') => {
                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            // Swipe
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const handleTouchStart = (e) => { setTouchEnd(null); setTouchStart(e.targetTouches[0].clientX); };
            const handleTouchMove = (e) => { setTouchEnd(e.targetTouches[0].clientX); };
            const handleTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const currentIndex = TABS.indexOf(activeTab);
                if (distance > 50 && currentIndex < TABS.length - 1) setActiveTab(TABS[currentIndex + 1]);
                if (distance < -50 && currentIndex > 0) setActiveTab(TABS[currentIndex - 1]);
                setTouchStart(null); setTouchEnd(null);
            };

            useEffect(() => {
                if (view === 'form') localStorage.setItem('immo_draft', JSON.stringify(currentClient));
            }, [currentClient, view]);

            useEffect(() => {
                setTimeout(() => lucide.createIcons(), 50);
            }, [view, activeTab, currentClient.medias, isMenuOpen, theme, toast.show]);

            const handleSave = () => {
                if (!currentClient.nom && !currentClient.prenom) {
                    showNotification('Nom ou prénom obligatoire.', 'error');
                    return;
                }
                let updatedClients = [...clients];
                const existingIndex = clients.findIndex(c => c.id === currentClient.id);
                if (existingIndex >= 0) updatedClients[existingIndex] = currentClient;
                else updatedClients = [currentClient, ...clients];

                try {
                    localStorage.setItem('immo_clients', JSON.stringify(updatedClients));
                    setClients(updatedClients);
                    localStorage.removeItem('immo_draft');
                    setCurrentClient(getEmptyClient());
                    setView('list');
                    showNotification('Dossier sauvegardé.');
                } catch (e) {
                    showNotification('Mémoire pleine. Nettoyez vos archives.', 'error');
                }
            };

            const toggleTheme = () => {
                setTheme(theme === 'dark' ? 'light' : 'dark');
                setIsMenuOpen(false);
            };

            const triggerCamera = () => document.getElementById('camera-input').click();
            const triggerGallery = () => document.getElementById('gallery-input').click();

            const handleShareText = async (c, e) => {
                e.stopPropagation();
                const text = `FICHE ESTIMATION : ${c.typeBien}\nCLIENT: ${c.nom} ${c.prenom}\nTEL: ${c.telephone} | EMAIL: ${c.email}\nADRESSE: ${c.adresse}\n\n--- BIEN ---\nSurfaces : ${c.surfaceHabitable}m² hab / ${c.surfaceCarrez}m² Carrez\nDistribution : ${c.distribution.pieces} Pièces, ${c.distribution.chambres} Chambres\n\n--- TECHNIQUE ---\nChauffage : ${c.chauffage.type}\nMenuiseries : ${c.menuiseries.vitrage}\n\n--- FINANCIER & PROJET ---\nFoncier: ${c.charges.fonciere}€ | Copro: ${c.charges.copro}€/mois\nProjet: ${c.projet.raison} (Délai: ${c.projet.delai})\nPrix attendu: ${c.projet.prixAttendu}€`;
                if (navigator.share) {
                    try { await navigator.share({ title: `Fiche ${c.nom}`, text }); } catch (err) {}
                } else {
                    navigator.clipboard.writeText(text);
                    showNotification("Copié dans le presse-papier.");
                }
            };

            const handleExportVCard = (c, e) => {
                e.stopPropagation();
                const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:${c.nom};${c.prenom};;;\nFN:${c.prenom} ${c.nom}\nTEL;TYPE=CELL:${c.telephone}\nEMAIL:${c.email}\nEND:VCARD`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard" }));
                a.download = `${c.nom}_${c.prenom}.vcf`;
                a.click();
            };

            const handleMediaUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                Promise.all(files.map(file => {
                    return new Promise((resolve) => {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const scale = 800 / img.width;
                                    canvas.width = 800; canvas.height = img.height * scale;
                                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                                    resolve({ type: 'image/jpeg', url: canvas.toDataURL('image/jpeg', 0.7) });
                                };
                                img.src = event.target.result;
                            };
                            reader.readAsDataURL(file);
                        } else {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve({ type: file.type, url: ev.target.result });
                            reader.readAsDataURL(file);
                        }
                    });
                })).then(newMedias => setCurrentClient(prev => ({ ...prev, medias: [...prev.medias, ...newMedias] })));
                e.target.value = '';
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white dark:bg-slate-950 shadow-xl relative">
                    
                    {/* Notification Toast */}
                    {toast.show && (
                        <div className={`absolute top-4 left-4 right-4 z-[60] p-4 rounded-xl shadow-xl flex items-center space-x-3 toast-enter ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`}>
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
                            <span className="font-bold text-sm">{toast.message}</span>
                        </div>
                    )}

                    <header className="bg-primary dark:bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-40 border-b border-slate-800">
                        <div className="flex items-center space-x-2">
                            {view !== 'home' && <i data-lucide="building-2" className="w-5 h-5 text-accent"></i>}
                            <span className="font-bold text-lg">{view !== 'home' ? 'Estimo' : ''}</span>
                        </div>
                        
                        {/* Menu Hamburger */}
                        <div className="relative">
                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 hover:bg-slate-800 rounded-lg transition-colors">
                                <i data-lucide="menu" className="w-6 h-6"></i>
                            </button>

                            {isMenuOpen && (
                                <>
                                    <div className="fixed inset-0 z-40" onClick={() => setIsMenuOpen(false)}></div>
                                    <div className="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-50 overflow-hidden">
                                        <button onClick={() => { setView('home'); setIsMenuOpen(false); }} className="w-full flex items-center px-4 py-3 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 font-medium border-b border-slate-100 dark:border-slate-700">
                                            <i data-lucide="home" className="w-5 h-5 mr-3 text-slate-400"></i> Accueil
                                        </button>
                                        <button onClick={toggleTheme} className="w-full flex items-center px-4 py-3 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 font-medium">
                                            <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-5 h-5 mr-3 text-slate-400"></i> {theme === 'dark' ? 'Mode Clair' : 'Mode Sombre'}
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 pb-20 overflow-x-hidden">
                        {view === 'home' && (
                            <div className="flex flex-col items-center justify-center min-h-[75vh] space-y-10">
                                <div className="flex flex-col items-center space-y-4">
                                    <div className="relative flex items-center justify-center w-28 h-28 bg-slate-100 dark:bg-slate-800 rounded-full shadow-inner border border-slate-200 dark:border-slate-700">
                                        <i data-lucide="home" className="w-14 h-14 text-primary dark:text-slate-400"></i>
                                        <span className="absolute font-extrabold text-3xl text-accent mt-2">?</span>
                                    </div>
                                    <div className="text-center">
                                        <h1 className="text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight">Estimo</h1>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest mt-1">Évaluation sur site</p>
                                    </div>
                                </div>

                                <div className="flex flex-col w-full space-y-4 max-w-sm px-2">
                                    <button onClick={() => { localStorage.removeItem('immo_draft'); setCurrentClient(getEmptyClient()); setActiveTab('client'); setView('form'); }}
                                            className="w-full flex items-center justify-center space-x-3 bg-accent text-white py-4 px-6 rounded-xl shadow-md">
                                        <i data-lucide="plus-circle" className="w-6 h-6"></i>
                                        <span className="font-medium text-lg">Nouveau Dossier</span>
                                    </button>
                                    <button onClick={() => setView('list')}
                                            className="w-full flex items-center justify-center space-x-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 py-4 px-6 rounded-xl border border-slate-200 dark:border-slate-700">
                                        <i data-lucide="folder-open" className="w-6 h-6"></i>
                                        <span className="font-medium text-lg">Archives ({clients.length})</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'list' && (
                            <div className="space-y-4">
                                {clients.length === 0 && <p className="text-center text-slate-500 dark:text-slate-400 mt-10">Aucune archive.</p>}
                                {clients.map(c => (
                                    <div key={c.id} onClick={() => { setCurrentClient(c); setActiveTab('client'); setView('form'); }} 
                                         className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-xl shadow-sm cursor-pointer relative pb-14">
                                        <h3 className="font-bold text-slate-800 dark:text-white">{c.nom} {c.prenom} <span className="text-xs font-normal text-accent bg-sky-50 dark:bg-slate-700 px-2 py-0.5 rounded-full ml-1">{c.typeBien}</span></h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">{c.adresse} • {c.date}</p>
                                        
                                        <div className="absolute bottom-3 left-4 right-4 flex space-x-2 border-t border-slate-100 dark:border-slate-700 pt-3">
                                            <button onClick={(e) => handleShareText(c, e)} className="flex-1 flex items-center justify-center space-x-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 py-2 rounded-lg text-xs font-bold">
                                                <i data-lucide="share-2" className="w-4 h-4"></i><span>Partager</span>
                                            </button>
                                            <button onClick={(e) => handleExportVCard(c, e)} className="flex-1 flex items-center justify-center space-x-1 bg-sky-50 dark:bg-sky-900/30 text-accent py-2 rounded-lg text-xs font-bold">
                                                <i data-lucide="user-plus" className="w-4 h-4"></i><span>VCard</span>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'form' && (
                            <div className="space-y-6" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                                <div className="flex overflow-x-auto space-x-2 pb-2 border-b border-slate-200 dark:border-slate-700 no-scrollbar">
                                    {TABS.map(tab => (
                                        <button key={tab} onClick={() => setActiveTab(tab)}
                                            className={`px-3 py-2 rounded-lg text-xs font-semibold capitalize ${activeTab === tab ? 'bg-primary dark:bg-accent text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>

                                <div className="tab-content" key={activeTab}>
                                    {activeTab === 'client' && (
                                        <>
                                            <div className="flex flex-col mb-3">
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1">Type de bien</label>
                                                <select value={currentClient.typeBien} onChange={e => setCurrentClient({...currentClient, typeBien: e.target.value})} className="p-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm outline-none">
                                                    <option>Appartement</option><option>Maison</option><option>Box / Garage</option><option>Terrain</option><option>Commerce / Bureau</option><option>Immeuble</option>
                                                </select>
                                            </div>
                                            <Field label="Nom" value={currentClient.nom} onChange={e => setCurrentClient({...currentClient, nom: e.target.value})} />
                                            <Field label="Prénom" value={currentClient.prenom} onChange={e => setCurrentClient({...currentClient, prenom: e.target.value})} />
                                            <Field label="Téléphone" type="tel" value={currentClient.telephone} onChange={e => setCurrentClient({...currentClient, telephone: e.target.value})} />
                                            <Field label="Email" type="email" value={currentClient.email} onChange={e => setCurrentClient({...currentClient, email: e.target.value})} />
                                            <Field label="Adresse du bien" value={currentClient.adresse} onChange={e => setCurrentClient({...currentClient, adresse: e.target.value})} />
                                        </>
                                    )}

                                    {activeTab === 'bien' && (
                                        <>
                                            <div className="grid grid-cols-2 gap-2">
                                                <Field label="Habitable (m²)" type="number" value={currentClient.surfaceHabitable} onChange={e => setCurrentClient({...currentClient, surfaceHabitable: e.target.value})} />
                                                <Field label="Carrez (m²)" type="number" value={currentClient.surfaceCarrez} onChange={e => setCurrentClient({...currentClient, surfaceCarrez: e.target.value})} />
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                <Field label="Pièces" type="number" value={currentClient.distribution.pieces} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, pieces: e.target.value}})} />
                                                <Field label="Chambres" type="number" value={currentClient.distribution.chambres} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, chambres: e.target.value}})} />
                                                <Field label="SDB" type="number" value={currentClient.distribution.sainte} onChange={e => setCurrentClient({...currentClient, distribution: {...currentClient.distribution, sainte: e.target.value}})} />
                                            </div>
                                            <Field label="Terrasse / Balcon (m²)" value={currentClient.annexes.terrasse} onChange={e => setCurrentClient({...currentClient, annexes: {...currentClient.annexes, terrasse: e.target.value}})} />
                                        </>
                                    )}

                                    {activeTab === 'technique' && (
                                        <>
                                            <Field label="Chauffage & Climatisation" value={currentClient.chauffage.type} onChange={e => setCurrentClient({...currentClient, chauffage: {...currentClient.chauffage, type: e.target.value}})} />
                                            <div className="flex flex-col mb-4 p-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-800">
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2">Équipements</label>
                                                <label className="flex items-center space-x-2 mb-2 text-sm"><input type="checkbox" checked={currentClient.equipements.cuisineEquipee} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, cuisineEquipee: e.target.checked}})} /><span>Cuisine équipée</span></label>
                                                <label className="flex items-center space-x-2 text-sm"><input type="checkbox" checked={currentClient.equipements.stationnement} onChange={e => setCurrentClient({...currentClient, equipements: {...currentClient.equipements, stationnement: e.target.checked}})} /><span>Stationnement</span></label>
                                            </div>
                                            <div className="flex flex-col mb-3">
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1">État (fissures, etc.)</label>
                                                <textarea className="p-3 border border-slate-200 dark:border-slate-700 rounded-xl text-sm w-full bg-white dark:bg-slate-800 dark:text-white outline-none" rows="2" value={currentClient.etat.notesEtat} onChange={e => setCurrentClient({...currentClient, etat: {...currentClient.etat, notesEtat: e.target.value}})}></textarea>
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'financier' && (
                                        <>
                                            <Field label="Taxe foncière (€)" type="number" value={currentClient.charges.fonciere} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, fonciere: e.target.value}})} />
                                            <Field label="Copro (€/mois)" type="number" value={currentClient.charges.copro} onChange={e => setCurrentClient({...currentClient, charges: {...currentClient.charges, copro: e.target.value}})} />
                                            <div className="grid grid-cols-2 gap-2">
                                                <Field label="Délai" value={currentClient.projet.delai} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, delai: e.target.value}})} />
                                                <Field label="Prix attendu (€)" type="number" value={currentClient.projet.prixAttendu} onChange={e => setCurrentClient({...currentClient, projet: {...currentClient.projet, prixAttendu: e.target.value}})} />
                                            </div>
                                        </>
                                    )}

                                    {activeTab === 'medias' && (
                                        <div className="space-y-4">
                                            <input id="camera-input" type="file" accept="image/jpeg, image/png, image/jpg" capture="camera" onChange={handleMediaUpload} className="hidden" />
                                            <input id="gallery-input" type="file" accept="image/*" multiple onChange={handleMediaUpload} className="hidden" />
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={triggerCamera} type="button" className="flex flex-col items-center p-4 border-2 border-accent border-dashed rounded-xl bg-sky-50 dark:bg-sky-900/20 text-accent">
                                                    <i data-lucide="camera" className="w-6 h-6 mb-1"></i><span className="text-xs font-bold">Photo</span>
                                                </button>
                                                <button onClick={triggerGallery} type="button" className="flex flex-col items-center p-4 border-2 border-slate-300 dark:border-slate-600 border-dashed rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                                    <i data-lucide="image" className="w-6 h-6 mb-1"></i><span className="text-xs font-bold">Galerie</span>
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                {currentClient.medias.map((m, i) => (
                                                    <div key={i} className="aspect-square bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden relative">
                                                        <img src={m.url} className="w-full h-full object-cover" />
                                                        <button onClick={(e) => {
                                                            e.stopPropagation();
                                                            const n = [...currentClient.medias]; n.splice(i, 1);
                                                            setCurrentClient({...currentClient, medias: n});
                                                        }} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1">
                                                            <i data-lucide="x" className="w-3 h-3"></i>
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <button onClick={handleSave} className="w-full bg-accent text-white py-4 rounded-xl shadow-lg mt-4 font-bold flex justify-center space-x-2">
                                    <i data-lucide="save" className="w-5 h-5"></i><span>Enregistrer</span>
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
